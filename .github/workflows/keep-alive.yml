# Supabase pauses free projects after about a week without requests. This
# sends one tiny read a day so the project stays awake. It needs two
# repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (Settings, Secrets
# and variables, Actions). Without them the job ends quietly.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets not set; nothing to do."
            exit 0
          fi
          # Row-level security makes this return an empty list to the anon
          # key, which is fine: the request itself counts as activity.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase answered HTTP $code"
          test "$code" -lt 500
